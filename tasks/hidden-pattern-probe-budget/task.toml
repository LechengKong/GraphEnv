schema_version = "1.4"

[task]
name = "jkong/hidden-pattern-probe-budget"
description = "Infer a hidden structural target in an unknown linked system from similarity feedback, with budgets on both exploration and scoring."
keywords = ["hypothesis-testing", "active-learning", "graph", "exploration"]

[metadata]
difficulty = "hard"
category = "scientific-reasoning"
benchmark_family = "interactive discovery / experimental design (cf. BoxingGym, DiscoveryWorld)"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[verifier]
environment_mode = "separate"
timeout_sec = 300.0

[[artifacts]]
source = "/state"
service = "oracle"
